disabled_rules:
  - todo
  - trailing_comma
  - nesting

type_name:
  excluded:
    - ID

identifier_name:
  allowed_symbols: ["$", "_"]
  excluded:
    - id
    - vc

# paths to ignore during linting.
excluded:
  - CodeEditModules/.build # Where Swift Package Manager checks out dependency sources
  - DerivedData

opt_in_rules:
  - attributes
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - missing_docs
#  - implicit_return
  - modifier_order
  - convenience_type
  - pattern_matching_keywords
  - multiline_parameters_brackets
  - multiline_arguments_brackets

custom_rules:
  spaces_over_tabs:
    included: ".*\\.swift"
    name: "Spaces over Tabs"
    regex: "\t"
    message: "Prefer spaces for indents over tabs. See Xcode setting: 'Text Editing' -> 'Indentation'"
    severity: warning
  # ADR-0007 §5 — provider SDK imports must stay inside Features/AIAssist.
  # This rule fires if an Anthropic/OpenAI/Google provider SDK import appears
  # outside that folder, making bypass visible in code review.
  ai_provider_import_guard:
    included: "(?!.*/Features/AIAssist/).*\\.swift"
    name: "AI Provider SDK Import Guard"
    regex: "^import (Anthropic|OpenAI|GoogleGenerativeAI|GoogleAICore)"
    message: "AI provider SDK imports must stay inside Features/AIAssist/ (ADR-0007 §5)."
    severity: error
